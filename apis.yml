aid: gitar
name: Gitar
description: >-
  Gitar is an AI code review platform that goes beyond commenting on pull and merge
  requests — it automatically fixes broken builds, failing tests, linting errors, and
  code-review findings, and validates every change against your CI pipeline before it
  is pushed. It works directly in the GitHub and GitLab PR interface, analyzes CI
  failures, deduplicates flaky tests, and runs natural-language repository rules from
  a .gitar/rules directory. Built by engineers from Uber's development stack and
  acquired by Sonar (SonarQube), Gitar is used by teams including SoFi, DeepL, and
  Altruist. It exposes a Bearer-token External API (api.gitar.ai/v1) on the Enterprise
  plan for installation health checks and GitLab project onboarding, and integrates
  with Buildkite, CircleCI, Bitrise, Jira, Linear, and Slack.
